<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Conta - LOJA DO JOATAN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SDKs do Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(circle at top, #002244 0%, #001026 30%, #000814 65%, #030712 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Animação suave para os elementos da página */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animated-box {
            animation: fadeInUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        header {
            background: linear-gradient(135deg, rgba(0, 26, 51, 0.9) 0%, rgba(0, 10, 26, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 102, 255, 0.25);
            padding: 20px 40px;
            text-align: center;
        }

        .logo h1 {
            font-family: 'Goudy Bookletter 1911', serif;
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .logo a {
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 0 12px rgba(0, 102, 255, 0.8);
            transition: 0.3s;
        }
        .logo a:hover { color: #3377ff; }

        /* Container Principal do Formulário */
        .auth-container {
            max-width: 440px;
            width: 90%;
            margin: 40px auto;
            background: linear-gradient(145deg, rgba(11, 19, 38, 0.9), rgba(4, 8, 20, 0.95));
            border: 1px solid rgba(0, 102, 255, 0.35);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 102, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .auth-header-text {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header-text h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .auth-header-text p {
            font-size: 13px;
            color: #88aacc;
        }

        /* Botão do Google Moderno */
        .btn-google {
            width: 100%;
            padding: 13px;
            background: #ffffff;
            color: #333333;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 22px;
        }

        .btn-google:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #557799;
            font-size: 12px;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 102, 255, 0.2);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        /* Abas Estilizadas */
        .tabs {
            display: flex;
            background: rgba(0, 10, 26, 0.6);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #88aacc;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0055ff, #0033cc);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.4);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #aaccff;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 102, 255, 0.3);
            background: rgba(0, 10, 26, 0.5);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #3377ff;
            background: rgba(0, 15, 36, 0.8);
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0055ff, #0033cc);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.35);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #3377ff, #0044ee);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.5);
        }

        .message-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .message-box.error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #ff6b6b;
        }

        .message-box.success {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid rgba(0, 200, 83, 0.5);
            color: #69f0ae;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #7799bb;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ffffff;
        }

        footer {
            background: #00050d;
            border-top: 1px solid rgba(0, 102, 255, 0.2);
            padding: 25px;
            text-align: center;
            font-size: 12px;
            color: #557799;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <h1><a href="index.html">LOJA DO JOATAN</a></h1>
        </div>
    </header>

    <main>
        <div class="auth-container animated-box">
            <div class="auth-header-text">
                <h2>Identificação da Conta</h2>
                <p>Acesse sua conta ou cadastre-se para aproveitar a loja</p>
            </div>

            <!-- Botão do Google -->
            <button type="button" class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                Continuar com o Google
            </button>

            <div class="divider">ou use seu e-mail</div>

            <div class="tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <!-- Form de Login -->
            <form id="login-form" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>E-MAIL</label>
                    <input type="email" id="login-email" placeholder="seuemail@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label>SENHA</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Entrar na Loja</button>
            </form>

            <!-- Form de Cadastro -->
            <form id="register-form" onsubmit="handleAuth(event, 'register')" style="display: none;">
                <div class="form-group">
                    <label>SEU E-MAIL</label>
                    <input type="email" id="register-email" placeholder="seuemail@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label>CRIE UMA SENHA (MÍN. 6 CARACTERES)</label>
                    <input type="password" id="register-password" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="btn-submit">Cadastrar Conta</button>
            </form>

            <div id="message-box" class="message-box"></div>

            <a href="index.html" class="back-link">&larr; Voltar para a página inicial</a>
        </div>
    </main>

    <footer>
        &copy; 2026 LOJA DO JOATAN - Todos os direitos reservados.
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcl5uTVYLbZh6tnXIhp3bJOqX-1nxhDb8",
            authDomain: "loja-do-joatan.firebaseapp.com",
            projectId: "loja-do-joatan",
            storageBucket: "loja-do-joatan.firebasestorage.app",
            messagingSenderId: "591394874196",
            appId: "1:591394874196:web:d8fff14992d0d081ab5ec1",
            measurementId: "G-N6Z0K097PW"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function switchTab(mode) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const msgBox = document.getElementById('message-box');

            msgBox.style.display = 'none';

            if (mode === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
            }
        }

        function showMessage(text, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            msgBox.style.display = 'block';
            msgBox.className = 'message-box ' + (isError ? 'error' : 'success');
        }

        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                showMessage('Login com Google bem-sucedido! Redirecionando...');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } catch (error) {
                showMessage('Erro ao entrar com Google: ' + error.message, true);
            }
        }

        async function handleAuth(event, type) {
            event.preventDefault();
            const msgBox = document.getElementById('message-box');
            msgBox.style.display = 'none';

            if (type === 'login') {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    showMessage('Login bem-sucedido! Redirecionando...');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } catch (error) {
                    showMessage('Erro ao entrar: E-mail ou senha incorretos.', true);
                }
            } else {
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;

                try {
                    await auth.createUserWithEmailAndPassword(email, password);
                    showMessage('Conta criada com sucesso! Redirecionando...');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } catch (error) {
                    if(error.code === 'auth/email-already-in-use'){
                        showMessage('Este e-mail já está cadastrado.', true);
                    } else {
                        showMessage('Erro ao cadastrar: ' + error.message, true);
                    }
                }
            }
        }
    </script>
</body>

</html>
