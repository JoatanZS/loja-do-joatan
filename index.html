<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOJA DO JOATAN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(circle at top, #002244 0%, #001026 30%, #000814 65%, #030712 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: linear-gradient(135deg, #001a33 0%, #000a1a 100%);
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            font-family: 'Goudy Bookletter 1911', serif;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .logo a {
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0, 102, 255, 0.8);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            font-size: 13px;
            color: #88aacc;
        }

        .btn-auth {
            padding: 8px 16px;
            background: linear-gradient(135deg, #0055ff, #002b80);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-auth:hover {
            background: linear-gradient(135deg, #3377ff, #003d99);
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid rgba(255, 50, 50, 0.5);
            color: #ff6b6b;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 50, 50, 0.4);
            color: #ffffff;
        }

        main {
            padding: 40px 20px;
            text-align: center;
            flex: 1;
        }

        .welcome-card {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(145deg, #0b1326, #040814);
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 16px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .welcome-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #88aacc;
            font-size: 14px;
        }

        footer {
            background: #000814;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6688aa;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <h1><a href="index.html">LOJA DO JOATAN</a></h1>
        </div>

        <div class="user-menu" id="user-menu">
            <!-- Esse conteúdo muda automaticamente via JS dependendo do estado do login -->
            <span class="user-email" id="user-display">Carregando...</span>
            <a href="login.html" class="btn-auth" id="btn-login-link" style="display: none;">Entrar / Cadastrar</a>
            <button class="btn-logout" id="btn-logout" onclick="fazerLogout()" style="display: none;">Sair / Mudar Conta</button>
        </div>
    </header>

    <main>
        <div class="welcome-card">
            <h2>Bem-vindo à LOJA DO JOATAN!</h2>
            <p>Aproveite nossas ofertas exclusivas.</p>
        </div>
    </main>

    <footer>
        &copy; LOJA DO JOATAN - Todos os direitos reservados.
    </footer>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBcl5uTVYLbZh6tnXIhp3bJOqX-1nxhDb8",
            authDomain: "loja-do-joatan.firebaseapp.com",
            projectId: "loja-do-joatan",
            storageBucket: "loja-do-joatan.firebasestorage.app",
            messagingSenderId: "591394874196",
            appId: "1:591394874196:web:d8fff14992d0d081ab5ec1",
            measurementId: "G-N6Z0K097PW"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Monitora se o usuário está logado ou não
        auth.onAuthStateChanged((user) => {
            const userDisplay = document.getElementById('user-display');
            const btnLoginLink = document.getElementById('btn-login-link');
            const btnLogout = document.getElementById('btn-logout');

            if (user) {
                // Usuário está logado
                userDisplay.innerText = "Olá, " + user.email;
                btnLoginLink.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                // Usuário não está logado
                userDisplay.innerText = "Você não está conectado.";
                btnLoginLink.style.display = 'inline-block';
                btnLogout.style.display = 'none';
            }
        });

        // Função para realizar o logout
        function fazerLogout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                alert('Erro ao sair da conta: ' + error.message);
            });
        }
    </script>
</body>

</html>
