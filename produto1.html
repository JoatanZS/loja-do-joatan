<!-- FIREBASE SDKs & LÓGICA DO SISTEMA -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas configurações do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBcl5uTVYLbZh6tnXIhp3bJOqX-1nxhDb8",
        authDomain: "loja-do-joatan.firebaseapp.com",
        projectId: "loja-do-joatan",
        storageBucket: "loja-do-joatan.firebasestorage.app",
        messagingSenderId: "591394874196",
        appId: "1:591394874196:web:d8fff14992d0d081ab5ec1",
        measurementId: "G-N6Z0K097PW"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    // Função de Login com Google
    window.loginGoogle = () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => {
            alert("Erro ao realizar login. Verifique se autorizou o domínio 'joatanzs.github.io' no Firebase.");
            console.error(err);
        });
    };

    // Monitora o estado de autenticação do usuário
    onAuthStateChanged(auth, (user) => {
        const authBox = document.getElementById("auth-box");
        const reviewForm = document.getElementById("review-form");
        const userDisplay = document.getElementById("user-display");

        if (user) {
            currentUser = user;
            if (authBox) authBox.style.display = "none";
            if (reviewForm) reviewForm.style.display = "flex";
            if (userDisplay) userDisplay.innerText = `Conectado como: ${user.displayName}`;
        } else {
            currentUser = null;
            if (authBox) authBox.style.display = "block";
            if (reviewForm) reviewForm.style.display = "none";
        }
    });

    // Função para Enviar a Avaliação para o Banco de Dados
    window.enviarAvaliacao = async (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const text = document.getElementById("review-text").value;
        const stars = parseInt(document.getElementById("rating-stars").value);

        try {
            await addDoc(collection(db, "avaliacoes_produto1"), {
                autor: currentUser.displayName,
                texto: text,
                estrelas: stars,
                data: serverTimestamp()
            });

            document.getElementById("review-text").value = "";
        } catch (error) {
            alert("Erro ao enviar avaliação: " + error.message);
        }
    };

    // Escutador em Tempo Real (Real-time Listener)
    const q = query(collection(db, "avaliacoes_produto1"), orderBy("data", "desc"));
    onSnapshot(q, (snapshot) => {
        const container = document.getElementById("reviews-container");
        if (!container) return;
        
        container.innerHTML = "";

        if (snapshot.empty) {
            container.innerHTML = "<p style='font-size:12px; color:#88aacc;'>Nenhuma avaliação ainda. Seja o primeiro a comentar!</p>";
            return;
        }

        snapshot.forEach(doc => {
            const data = doc.data();
            const starStr = "★".repeat(data.estrelas) + "☆".repeat(5 - data.estrelas);

            container.innerHTML += `
                <div class="review-item">
                    <div class="review-header">
                        <span class="review-author">${data.autor}</span>
                        <span class="review-stars">${starStr}</span>
                    </div>
                    <p class="review-text">${data.texto}</p>
                </div>
            `;
        });
    });
</script>
